<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Adicionar novo livro</title>
</head>
<body>
    <a href="index.html" class="home-link">← Voltar</a>
    <form action="" method="post">
    <h2>Adicionar novo livro</h2>

    <label for="nome">Nome do livro:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="img">Capa:</label>
    <input type="file" name="imagem">

    <label for="autor">Autor:</label>
    <input type="text" id="autor" name="autor">

    <label for="sinopse">Sinopse:</label>
    <textarea id="sinopse" name="sinopse" rows="5"></textarea>

    <label for="link-livro">Link para compra online:</label>
    <input type="url" id="linkLivro" name="linkLivro">

    <button type="submit">Adicionar livro</button>
</form>
</body>
</html>
